<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>You're offline — Greece</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0e12;
        color: #f2ede6;
        font-family: -apple-system, "Segoe UI", Arial, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 420px; }
      h1 { font-size: 28px; margin: 0 0 12px; }
      p { color: #a39a8d; line-height: 1.6; }
      button {
        margin-top: 20px;
        padding: 12px 28px;
        border-radius: 100px;
        border: none;
        background: #c88a58;
        color: #0b0e12;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>This page isn't available without an internet connection. Check your connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
